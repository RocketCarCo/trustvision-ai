# TrustVision AI - Docker Compose Configuration
#
# Quick Start:
#   docker-compose up --build
#
# Access:
#   Web App:  http://localhost:5000 (Real-time with webcam)
#   API Docs: http://localhost:8000/docs (File upload API)

services:
  # ==========================================================================
  # TrustVision AI - Real-time Web Application (Port 5000)
  # ==========================================================================
  trustvision-webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: trustvision-webapp

    ports:
      - "5001:5000"

    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO

    volumes:
      - trustvision_models:/app/models
      - ./models:/app/models:ro

    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # TrustVision AI - REST API (Port 8000)
  # ==========================================================================
  trustvision-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustvision-api

    ports:
      - "8000:8000"

    environment:
      - MODEL_CACHE_DIR=/app/models
      - UPLOAD_DIR=/app/uploads
      - SAMPLES_DIR=/app/samples
      - LOG_LEVEL=INFO
      - DEVICE=cpu
      - WHISPER_MODEL=base
      - DEBUG=false

    volumes:
      - trustvision_models:/app/models
      - trustvision_uploads:/app/uploads
      - ./samples:/app/samples:ro

    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==========================================================================
# Named Volumes
# ==========================================================================
volumes:
  trustvision_models:
    driver: local
    name: trustvision_models
  trustvision_uploads:
    driver: local
    name: trustvision_uploads

# ==========================================================================
# Networks
# ==========================================================================
networks:
  default:
    name: trustvision_network
